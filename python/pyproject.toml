[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ntlogger"
version = "0.1.0"
description = "NightSquawk log contract, redaction and context for Python logging"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ntlogger = ["contract.json", "py.typed"]
